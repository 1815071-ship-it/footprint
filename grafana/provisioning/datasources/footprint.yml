apiVersion: 1
datasources:
  - name: Footprint
    uid: footprint
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana_ro          # только чтение; создаётся в grafana.sh
    isDefault: true
    editable: false
    jsonData:
      database: footprint
      sslmode: disable
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
