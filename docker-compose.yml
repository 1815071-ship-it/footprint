# Footprint: сбор сделок с бирж -> Postgres -> Grafana.
# Отдельный проект, мост Upscale (/root/bridge) не трогает.
name: footprint

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: footprint
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=8MB", "-c", "max_connections=20"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d footprint"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  collector:
    build: ./collector
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://fp:${PG_PASSWORD}@db:5432/footprint
      BIG_USD: "100000"
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
    logging: *logs

  # Grafana (шаг 5). Запуск и обновление: bash grafana.sh
  # Снаружи доступна через Caddy моста: https://andrey-bridge.duckdns.org/fp/ (порт на сервере не открывает).
  grafana:
    image: grafana/grafana:12.4.12          # 12.0.x уязвима (CVE-2026-27876), 12.4.12 - с исправлениями
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}   # read-only пользователь базы, см. grafana.sh
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://andrey-bridge.duckdns.org/fp/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"         # вход только через форму, без логина/пароля в API-запросах
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: volkovlabs-echarts-panel@7.2.5
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/footprint.json
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      default: {}
      edge:
        aliases: [footprint-grafana]       # по этому имени Grafana находит Caddy моста
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 384m
    logging: *logs

networks:
  # Сеть моста Upscale: в неё подключена только Grafana, чтобы Caddy моста мог отдать её наружу.
  edge:
    external: true
    name: bridge_default

volumes:
  pgdata:
  grafana:
